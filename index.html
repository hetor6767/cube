<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Visor 3D Interactivo Táctil - Cubo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .instruction {
      position: fixed;
      top: 25px;
      color: #bbbbbb;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      line-height: 1.4;
    }

    /* Escena 3D */
    .scene {
      width: 180px;
      height: 180px;
      perspective: 800px;
      margin-bottom: 60px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: scale(1) rotateX(-20deg) rotateY(20deg);
      transition: transform 0.05s ease-out;
    }

    /* Caras del cubo */
    .face {
      position: absolute;
      width: 180px;
      height: 180px;
      background: rgba(0, 123, 255, 0.88);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      transition: background 0.4s, border 0.4s, transform 0.5s;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }

    /* Posiciones en estado Sólido */
    .front  { transform: rotateY(0deg) translateZ(90px); }
    .back   { transform: rotateY(180deg) translateZ(90px); }
    .right  { transform: rotateY(90deg) translateZ(90px); }
    .left   { transform: rotateY(-90deg) translateZ(90px); }
    .top    { transform: rotateX(90deg) translateZ(90px); }
    .bottom { transform: rotateX(-90deg) translateZ(90px); }

    /* Estado: Aristas */
    .cube.aristas .face {
      background: rgba(0, 255, 204, 0.05) !important;
      border: 4px solid #00ffcc !important;
      box-shadow: 0 0 15px #00ffcc;
      color: #00ffcc;
    }

    /* Estado: Desarmado (Vista explotada) */
    .cube.desarmado .front  { transform: rotateY(0deg) translateZ(200px); background: rgba(255, 71, 87, 0.85); }
    .cube.desarmado .back   { transform: rotateY(180deg) translateZ(200px); background: rgba(255, 165, 2, 0.85); }
    .cube.desarmado .right  { transform: rotateY(90deg) translateZ(200px); background: rgba(46, 213, 115, 0.85); }
    .cube.desarmado .left   { transform: rotateY(-90deg) translateZ(200px); background: rgba(30, 144, 255, 0.85); }
    .cube.desarmado .top    { transform: rotateX(90deg) translateZ(200px); background: rgba(83, 82, 237, 0.85); }
    .cube.desarmado .bottom { transform: rotateX(-90deg) translateZ(200px); background: rgba(255, 107, 129, 0.85); }

    /* Botonera */
    .controls {
      position: fixed;
      bottom: 30px;
      display: flex;
      gap: 10px;
      z-index: 100;
      touch-action: auto;
    }

    .btn {
      background-color: #007bff;
      color: white;
      border: 2px solid white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .btn:active { background-color: #0056b3; }
  </style>
</head>
<body>
<div class="nav-bar" style="position:fixed; top:15px; display:flex; gap:10px; z-index:1000; touch-action:auto;">
  <a href="index.html" style="background:#007bff; color:white; text-decoration:none; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:bold; border:1px solid #007bff;">📦 Cubo</a>
  <a href="triangulo.html" style="background:rgba(255,255,255,0.15); color:white; text-decoration:none; padding:6px 14px; border-radius:20px; font-size:13px; font-weight:bold; border:1px solid rgba(255,255,255,0.3);">🔺 Pirámide</a>
</div>
  <div class="instruction">
    usa 1 dedo para girar<br>
     y 2 dedos para hacerle zoom
  </div>

  <div class="scene">
    <div id="cube" class="cube entero">
      <div class="face front">1</div>
      <div class="face back">2</div>
      <div class="face right">3</div>
      <div class="face left">4</div>
      <div class="face top">5</div>
      <div class="face bottom">6</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="setVista('entero')">Sólido</button>
    <button class="btn" onclick="setVista('aristas')">Aristas</button>
    <button class="btn" onclick="setVista('desarmado')">Desarmado</button>
  </div>

  <script>
    const cube = document.getElementById('cube');
    let isDragging = false;
    let previousPos = { x: 0, y: 0 };
    let rotX = -20;
    let rotY = 20;
    let scale = 1.0;
    let initialPinchDistance = null;
    let initialScale = 1.0;

    function renderTransform() {
      cube.style.transform = `scale(${scale}) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    // Control Mouse - Arrastre
    window.addEventListener('mousedown', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      isDragging = true;
      previousPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - previousPos.x;
      const deltaY = e.clientY - previousPos.y;

      rotY += deltaX * 0.7;
      rotX -= deltaY * 0.7;

      renderTransform();
      previousPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Control Zoom Mouse (Rueda)
    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) {
        scale = Math.min(scale + 0.1, 2.5);
      } else {
        scale = Math.max(scale - 0.1, 0.4);
      }
      renderTransform();
    }, { passive: false });

    // Control Táctil Celular (Giro + Pinch Zoom)
    window.addEventListener('touchstart', (e) => {
      if (e.target.tagName === 'BUTTON') return;

      if (e.touches.length === 1) {
        isDragging = true;
        previousPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getDistance(e.touches);
        initialScale = scale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        const deltaX = e.touches[0].clientX - previousPos.x;
        const deltaY = e.touches[0].clientY - previousPos.y;

        rotY += deltaX * 0.7;
        rotX -= deltaY * 0.7;

        renderTransform();
        previousPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const currentDistance = getDistance(e.touches);
        const factor = currentDistance / initialPinchDistance;
        scale = Math.min(Math.max(initialScale * factor, 0.4), 2.5);
        renderTransform();
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
      if (e.touches.length === 0) {
        isDragging = false;
      }
    });

    // Cambiar estados
    function setVista(modo) {
      cube.classList.remove('entero', 'aristas', 'desarmado');
      cube.classList.add(modo);
    }
  </script>
</body>
</html>
