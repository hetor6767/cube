<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D Interactivo - Cubo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Escena 3D */
    .scene {
      width: 180px;
      height: 180px;
      perspective: 800px;
      margin-bottom: 60px;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spin 10s infinite linear;
      transition: transform 0.5s ease;
    }

    @keyframes spin {
      from { transform: rotateX(-20deg) rotateY(0deg); }
      to { transform: rotateX(-20deg) rotateY(360deg); }
    }

    /* Caras del cubo */
    .face {
      position: absolute;
      width: 180px;
      height: 180px;
      background: rgba(0, 123, 255, 0.88);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
      transition: all 0.6s ease;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
    }

    /* Posiciones en estado Sólido */
    .front  { transform: rotateY(0deg) translateZ(90px); }
    .back   { transform: rotateY(180deg) translateZ(90px); }
    .right  { transform: rotateY(90deg) translateZ(90px); }
    .left   { transform: rotateY(-90deg) translateZ(90px); }
    .top    { transform: rotateX(90deg) translateZ(90px); }
    .bottom { transform: rotateX(-90deg) translateZ(90px); }

    /* Estado: Aristas */
    .cube.aristas .face {
      background: rgba(0, 255, 204, 0.05) !important;
      border: 4px solid #00ffcc !important;
      box-shadow: 0 0 15px #00ffcc;
      color: #00ffcc;
    }

    /* Estado: Desarmado (Vista explotada) */
    .cube.desarmado .front  { transform: rotateY(0deg) translateZ(200px); background: rgba(255, 71, 87, 0.85); }
    .cube.desarmado .back   { transform: rotateY(180deg) translateZ(200px); background: rgba(255, 165, 2, 0.85); }
    .cube.desarmado .right  { transform: rotateY(90deg) translateZ(200px); background: rgba(46, 213, 115, 0.85); }
    .cube.desarmado .left   { transform: rotateY(-90deg) translateZ(200px); background: rgba(30, 144, 255, 0.85); }
    .cube.desarmado .top    { transform: rotateX(90deg) translateZ(200px); background: rgba(83, 82, 237, 0.85); }
    .cube.desarmado .bottom { transform: rotateX(-90deg) translateZ(200px); background: rgba(255, 107, 129, 0.85); }

    /* Botonera */
    .controls {
      position: fixed;
      bottom: 30px;
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .btn {
      background-color: #007bff;
      color: white;
      border: 2px solid white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .btn:active { background-color: #0056b3; }
  </style>
</head>
<body>

  <div class="scene">
    <div id="cube" class="cube entero">
      <div class="face front">1</div>
      <div class="face back">2</div>
      <div class="face right">3</div>
      <div class="face left">4</div>
      <div class="face top">5</div>
      <div class="face bottom">6</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="setVista('entero')">Sólido</button>
    <button class="btn" onclick="setVista('aristas')">Aristas</button>
    <button class="btn" onclick="setVista('desarmado')">Desarmado</button>
  </div>

  <script>
    function setVista(modo) {
      document.getElementById('cube').className = 'cube ' + modo;
    }
  </script>
</body>
</html>
