<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo Interactivo 3D</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #121212; }
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      gap: 12px;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: 2px solid #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .btn:active {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Botones de Acción -->
  <div class="controls">
    <button class="btn" onclick="cambiarVista('entero')">Sólido</button>
    <button class="btn" onclick="cambiarVista('aristas')">Aristas</button>
    <button class="btn" onclick="cambiarVista('desarmado')">Desarmado</button>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false">
    <!-- Iluminación -->
    <a-light type="ambient" intensity="1.2"></a-light>
    <a-light type="directional" position="2 4 3" intensity="1.5"></a-light>

    <a-sky color="#1a1a1a"></a-sky>

    <!-- Cubo 3D en Rotación Continua -->
    <a-entity position="0 0 -3" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      
      <!-- Estado 1: Cubo Sólido -->
      <a-entity id="vista-entero" visible="true">
        <a-box position="0 0 0" scale="1.3 1.3 1.3" material="color: #007bff; metalness: 0.3; roughness: 0.2"></a-box>
      </a-entity>

      <!-- Estado 2: Aristas (Wireframe / Estructura) -->
      <a-entity id="vista-aristas" visible="false">
        <a-box position="0 0 0" scale="1.3 1.3 1.3" material="color: #00ffcc; wireframe: true; wireframeLinewidth: 4"></a-box>
      </a-entity>

      <!-- Estado 3: Desarmado (Vista Explotada / 6 Caras Separadas) -->
      <a-entity id="vista-desarmado" visible="false">
        <a-box position="-0.9 0 0" scale="0.5 0.5 0.5" material="color: #ff4757"></a-box>
        <a-box position="0.9 0 0" scale="0.5 0.5 0.5" material="color: #ffa502"></a-box>
        <a-box position="0 0.9 0" scale="0.5 0.5 0.5" material="color: #2ed573"></a-box>
        <a-box position="0 -0.9 0" scale="0.5 0.5 0.5" material="color: #1e90ff"></a-box>
        <a-box position="0 0 0.9" scale="0.5 0.5 0.5" material="color: #5352ed"></a-box>
        <a-box position="0 0 -0.9" scale="0.5 0.5 0.5" material="color: #ff6b81"></a-box>
      </a-entity>

    </a-entity>

    <a-entity camera position="0 0 0" look-controls></a-entity>
  </a-scene>

  <script>
    function cambiarVista(tipo) {
      document.getElementById('vista-entero').setAttribute('visible', tipo === 'entero');
      document.getElementById('vista-aristas').setAttribute('visible', tipo === 'aristas');
      document.getElementById('vista-desarmado').setAttribute('visible', tipo === 'desarmado');
    }
  </script>
</body>
</html>
