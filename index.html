<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo Interactivo 3D</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <style>
    .controls {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      display: flex;
      gap: 10px;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: 2px solid white;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body style="margin: 0; background-color: #1a1a1a;">

  <div class="controls">
    <button class="btn" onclick="mostrarModelo('entero')">Sólido</button>
    <button class="btn" onclick="mostrarModelo('aristas')">Aristas</button>
    <button class="btn" onclick="mostrarModelo('desarmado')">Desarmado</button>
  </div>

  <a-scene embedded>
    <a-assets>
      <a-asset-item id="m-entero" src="cubo_entero.glb"></a-asset-item>
      <a-asset-item id="m-aristas" src="cubo_aristas.glb"></a-asset-item>
      <a-asset-item id="m-desarmado" src="cubo_desarmado.glb"></a-asset-item>
    </a-assets>

    <a-sky color="#222"></a-sky>

    <!-- Modelo 3D editable interactivo en pantalla -->
    <a-entity id="cubo-entero" gltf-model="#m-entero" scale="1 1 1" position="0 0 -3" visible="true"></a-entity>
    <a-entity id="cubo-aristas" gltf-model="#m-aristas" scale="1 1 1" position="0 0 -3" visible="false"></a-entity>
    <a-entity id="cubo-desarmado" gltf-model="#m-desarmado" scale="1 1 1" position="0 0 -3" visible="false"></a-entity>

    <a-entity camera look-controls orbit-controls="target: 0 0 -3"></a-entity>
  </a-scene>

  <script>
    function mostrarModelo(tipo) {
      document.getElementById('cubo-entero').setAttribute('visible', tipo === 'entero');
      document.getElementById('cubo-aristas').setAttribute('visible', tipo === 'aristas');
      document.getElementById('cubo-desarmado').setAttribute('visible', tipo === 'desarmado');
    }
  </script>
</body>
</html>
