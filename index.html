<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo Interactivo RA</title>
  <!-- Librerías de A-Frame y AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    /* Estilos para los botones en la pantalla del celular */
    .controls {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      gap: 10px;
    }
    .btn {
      background-color: #007bff;
      color: white;
      border: 2px solid white;
      padding: 12px 16px;
      border-radius: 8px;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }
    .btn:active {
      background-color: #004494;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Botones flotantes -->
  <div class="controls">
    <button class="btn" onclick="mostrarModelo('entero')">Sólido</button>
    <button class="btn" onclick="mostrarModelo('aristas')">Aristas</button>
    <button class="btn" onclick="mostrarModelo('desarmado')">Desarmado</button>
  </div>

  <!-- Escena de Realidad Aumentada -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <!-- Carga de archivos 3D -->
    <a-assets>
      <a-asset-item id="m-entero" src="cubo_entero.glb"></a-asset-item>
      <a-asset-item id="m-aristas" src="cubo_aristas.glb"></a-asset-item>
      <a-asset-item id="m-desarmado" src="cubo_desarmado.glb"></a-asset-item>
    </a-assets>

    <!-- Marcador estándar Hiro -->
    <a-marker preset="hiro">
      <a-entity id="cubo-entero" gltf-model="#m-entero" scale="0.5 0.5 0.5" position="0 0 0" visible="true"></a-entity>
      <a-entity id="cubo-aristas" gltf-model="#m-aristas" scale="0.5 0.5 0.5" position="0 0 0" visible="false"></a-entity>
      <a-entity id="cubo-desarmado" gltf-model="#m-desarmado" scale="0.5 0.5 0.5" position="0 0 0" visible="false"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Lógica de los botones -->
  <script>
    function mostrarModelo(tipo) {
      const entero = document.getElementById('cubo-entero');
      const aristas = document.getElementById('cubo-aristas');
      const desarmado = document.getElementById('cubo-desarmado');

      entero.setAttribute('visible', tipo === 'entero');
      aristas.setAttribute('visible', tipo === 'aristas');
      desarmado.setAttribute('visible', tipo === 'desarmado');
    }
  </script>
</body>
</html>
